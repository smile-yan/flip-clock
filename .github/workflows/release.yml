name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

env:
  APP_NAME: flip-clock
  RUST_TOOLCHAIN: '1.95.0'
  NODE_VERSION: '24'

jobs:
  build:
    name: Build ${{ matrix.platform }}-${{ matrix.arch }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            platform: linux
            arch: x86_64-unknown-linux-gnu
          - os: windows-latest
            platform: windows
            arch: x86_64-pc-windows-msvc
          - os: macos-latest
            platform: darwin
            arch: aarch64-apple-darwin
          - os: macos-latest
            platform: darwin
            arch: x86_64-apple-darwin

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          targets: ${{ matrix.arch }}

      - name: Install Linux dependencies
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libjavascriptcoregtk-4.1-dev \
            libsoup-3.0-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev

      - name: Install Tauri CLI
        run: cargo install tauri-cli

      # Verify the committed icon.ico has matching header width/height on every
      # layer — guards against the regression where a 512-px PNG payload was
      # embedded under a 256-px ICO header, which Windows renders by trusting
      # the header and produces a blurry taskbar icon.
      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install Pillow
        run: pip install pillow

      - name: Verify icon.ico layer sizes
        run: |
          # Write script to a temp file first — required because Windows runners
          # use PowerShell (pwsh) which does not support bash/zsh heredoc syntax.
          python3 -c "
          import os, sys
          script = '''import struct, io, sys
          from PIL import Image
          with open('src-tauri/icons/icon.ico', 'rb') as f:
              data = f.read()
          _, _, count = struct.unpack('<HHH', data[:6])
          bad = []
          sizes = []
          for i in range(count):
              w, _h = struct.unpack('<BB', data[6 + i*16 : 8 + i*16])
              psz, poff = struct.unpack('<II', data[14 + i*16 : 22 + i*16])
              hd = 256 if w == 0 else w
              sizes.append(hd)
              actual = Image.open(io.BytesIO(data[poff:poff+psz])).size
              if actual != (hd, hd):
                  bad.append((i, hd, actual))
          if bad:
              print('ICO header/payload mismatch:', bad, file=sys.stderr)
              sys.exit(1)
          print(f'OK: {count} layers, all header==payload, sizes={sorted(sizes, reverse=True)}')
          '''
          path = os.path.join(os.environ.get('TEMP', '/tmp'), 'verify_ico.py')
          with open(path, 'w') as f:
              f.write(script)
          os.execv(sys.executable, [sys.executable, path])
          "

      - name: Build
        run: |
          cd src-tauri
          cargo tauri build --target ${{ matrix.arch }}

      - name: Rename artifacts to v-tag format
        shell: bash
        run: |
          set -euo pipefail
          cd src-tauri/target/${{ matrix.arch }}/release/bundle
          TAG="${{ github.ref_name }}"   # e.g. v1.0.1 (already includes 'v')
          APP="${{ env.APP_NAME }}"      # e.g. flip-clock
          ARCH="${{ matrix.arch }}"

          # Map arch to a human-friendly triple used in the filename
          case "$ARCH" in
            x86_64-unknown-linux-gnu)  SHORT=linux-x86_64  ;;
            x86_64-pc-windows-msvc)    SHORT=windows-x86_64 ;;
            aarch64-apple-darwin)      SHORT=macos-arm64    ;;
            x86_64-apple-darwin)       SHORT=macos-x86_64   ;;
            *)                         SHORT="$ARCH"        ;;
          esac

          # Tauri default names embed the version from tauri.conf.json, not the
          # git tag. Rewrite each known bundle output to flip-clock-v{tag}-{plat}-{arch}.{ext}.
          # Only touch distributable artifacts at depth ≤ 2 — never recurse into
          # .app bundles (they're directories whose internal layout is fixed by
          # macOS) or inside installers.
          rename_one() {
            local f="$1"
            local dir ext base new
            dir=$(dirname "$f")
            base=$(basename "$f")
            # Detect "extension" by matching known distributable suffixes.
            # Order matters: check compound suffixes before bare ones.
            case "$base" in
              *_x64-setup.exe)  ext="exe"; suffix="-setup" ;;
              *.exe)            ext="exe"; suffix="" ;;
              *.msi)            ext="msi"; suffix="" ;;
              *.AppImage)       ext="AppImage"; suffix="" ;;
              *.deb)            ext="deb"; suffix="" ;;
              *.rpm)            ext="rpm"; suffix="" ;;
              *.dmg)            ext="dmg"; suffix="" ;;
              *.app)            ext="app"; suffix="" ;;
              *)                return 0 ;;  # skip unrelated files
            esac
            new="$APP-$TAG-$SHORT"
            mv "$f" "$dir/$new$suffix.$ext"
          }

          # -maxdepth 2 covers bundle/dmg/*.dmg, bundle/macos/*.app,
          # bundle/nsis/*.exe, bundle/msi/*.msi, etc. — but never the
          # internals of a .app directory.
          while IFS= read -r f; do
            rename_one "$f"
          done < <(find . -maxdepth 2 \( -name '*.dmg' -o -name '*.app' -o -name '*.exe' -o -name '*.msi' -o -name '*.deb' -o -name '*.rpm' -o -name '*.AppImage' \))

          echo "--- after rename ---"
          find . -maxdepth 2 -type f -o -maxdepth 2 -type d -name '*.app'

      # Render update.json from the template at the repo root: replace the
      # `{{VERSION}}` and `{{DATE}}` placeholders with the actual tag and
      # the build's UTC date so the updater plugin can parse a real
      # manifest. Per-platform platforms map 1:1 to the rename step above,
      # so the URLs in the manifest match the artifacts on disk.
      # Only runs on tag pushes (not on workflow_dispatch dry-runs) to
      # avoid baking placeholder values into an uploaded release artifact.
      - name: Render update.json
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          set -euo pipefail
          TAG="${{ github.ref_name }}"          # e.g. v1.0.9
          VER="${TAG#v}"                        # strip leading 'v'
          DATE="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          cd "$GITHUB_WORKSPACE"
          sed -e "s/{{VERSION}}/${VER}/g" \
              -e "s/{{DATE}}/${DATE}/g" \
              update.json > rendered-update.json
          echo "--- rendered update.json ---"
          cat rendered-update.json
          # Stash it next to the bundle so the upload step picks it up.
          mkdir -p src-tauri/target/${{ matrix.arch }}/release/bundle/
          cp rendered-update.json src-tauri/target/${{ matrix.arch }}/release/bundle/update.json

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.APP_NAME }}-${{ github.ref_name }}-${{ matrix.platform }}-${{ matrix.arch }}
          path: src-tauri/target/${{ matrix.arch }}/release/bundle/
          if-no-files-found: error

  package-macos:
    name: Package macOS DMG
    needs: build
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Download macOS artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: ${{ env.APP_NAME }}-${{ github.ref_name }}-darwin-*
          path: bundle

      - name: List downloaded
        run: |
          find bundle -type f | head -20

      - name: Create universal DMG
        run: |
          set -euo pipefail
          cd bundle

          # Find the two per-arch DMG files (renamed by the build job to
          # flip-clock-v{tag}-macos-arm64.dmg / -macos-x86_64.dmg).
          ARM64_DMG=$(find . -name "*macos-arm64.dmg" 2>/dev/null | head -1)
          AMD64_DMG=$(find . -name "*macos-x86_64.dmg" 2>/dev/null | head -1)
          echo "Arm64 DMG: $ARM64_DMG"
          echo "Amd64 DMG: $AMD64_DMG"

          if [ -z "$ARM64_DMG" ] || [ -z "$AMD64_DMG" ]; then
            echo "Error: Missing DMG files"
            exit 1
          fi

          # Mount both DMGs read-only and copy the arm64 .app as the
          # scaffold (it owns the Info.plist + Resources we keep).
          mkdir -p /tmp/arm64-app /tmp/amd64-app /tmp/universal
          hdiutil attach "$ARM64_DMG" -readonly -nobrowse -mountpoint /tmp/arm64-app
          cp -R /tmp/arm64-app/*.app /tmp/universal/
          hdiutil detach /tmp/arm64-app

          hdiutil attach "$AMD64_DMG" -readonly -nobrowse -mountpoint /tmp/amd64-app
          AMD64_APP=$(ls -d /tmp/amd64-app/*.app 2>/dev/null | head -1)

          # Copy the amd64 binary to a stable path BEFORE we detach the
          # DMG. Once the mount is gone, $AMD64_APP/Contents/MacOS/flip-clock
          # becomes a stale path on a dead mount, and `lipo -create` would
          # silently (or noisily — depending on the lipo version) fail with
          # "file not found". `/tmp` survives the detach, so this is the
          # right place to materialize the input file.
          AMD64_BIN_COPY="/tmp/amd64-flip-clock-bin"
          cp "$AMD64_APP/Contents/MacOS/flip-clock" "$AMD64_BIN_COPY"
          hdiutil detach /tmp/amd64-app

          UNI_APP="/tmp/universal/$(basename "$AMD64_APP")"
          ARM64_BIN="$UNI_APP/Contents/MacOS/flip-clock"
          AMD64_BIN="$AMD64_BIN_COPY"

          if [ ! -f "$AMD64_BIN" ]; then
            echo "Error: amd64 binary not found at $AMD64_BIN"
            exit 1
          fi

          # Merge the two architectures into a single fat Mach-O. The old
          # flow simply `cp`d the amd64 binary on top of the arm64 one,
          # which silently produced an amd64-only binary dressed up as
          # "universal". `lipo -create` is what produces a real fat
          # binary that runs natively on both Apple Silicon and Intel.
          mv "$ARM64_BIN" "$ARM64_BIN.arm64"
          lipo -create \
              "$ARM64_BIN.arm64" \
              "$AMD64_BIN" \
              -output "$ARM64_BIN"
          rm "$ARM64_BIN.arm64"
          chmod +x "$ARM64_BIN"

          # Verify the result is actually fat (architectures listed in
          # the Mach-O header). If lipo silently dropped an arch (rare,
          # but it can happen with version mismatches) the DMG would
          # be broken — fail loud here instead of uploading a half-built
          # universal bundle.
          #
          # `lipo -info` on macOS prints (e.g. for a fat binary):
          #   "Architectures in the fat file: <path> are: <arches>"
          # Splitting on ': ' gives 4 fields; the architectures are
          # always the LAST field, so use $NF (not $2, which is the path
          # — a previous version of this script shipped with $2 and
          # silently passed the verification against the path string).
          ARCHES=$(lipo -info "$ARM64_BIN" | awk -F': ' '{print $NF}' | tr -d ' ')
          echo "Universal binary architectures: '$ARCHES'"
          case "$ARCHES" in
            *arm64*x86_64*|*x86_64*arm64*) ;;
            *) echo "Error: expected fat binary with both arm64 and x86_64, got: '$ARCHES'"; exit 1 ;;
          esac

          ln -sf /Applications /tmp/universal/

          # Create DMG (APFS, no HFS+/scrub — those legacy flags trip the
          # macOS 26 runner with `hdiutil: create failed - Resource busy`.)
          # Switch from UDZO (zlib) to UDBZ (bzip2) for ~10-20% smaller DMG
          # on the fat-binary .app. Build is one-shot per release so the
          # extra compression time is acceptable.
          hdiutil create \
            -volname "Flip Clock" \
            -srcfolder /tmp/universal \
            -ov -format UDBZ \
            ../flip-clock-${{ github.ref_name }}-macos-universal.dmg

      - name: Upload
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.APP_NAME }}-${{ github.ref_name }}-macos-universal
          path: flip-clock-${{ github.ref_name }}-macos-universal.dmg
          if-no-files-found: error

  release:
    name: Create Release
    needs:
      - build
      - package-macos
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: ${{ env.APP_NAME }}-${{ github.ref_name }}-*
          path: release-assets
          merge-multiple: true

      - name: List assets
        run: |
          echo "=== Assets ==="
          find release-assets -type f -exec ls -lh {} \;

      - name: Pick one rendered update.json
        # Each per-platform build job rendered its own copy of update.json
        # and stashed it under its own bundle/ directory. They're all
        # byte-identical (same tag, same date), so pick the first one and
        # publish it once as `update.json` at the release root.
        run: |
          set -euo pipefail
          find release-assets -name update.json -type f | head -1 | xargs -I {} cp {} update.json
          ls -lh update.json

      - name: Create release
        uses: softprops/action-gh-release@v3
        with:
          draft: true
          generate_release_notes: true
          files: |
            release-assets/nsis/*.exe
            release-assets/deb/*.deb
            release-assets/rpm/*.rpm
            release-assets/msi/*.msi
            # Top-level *.dmg is the universal DMG uploaded by package-macos.
            # The **/dmg/*.dmg glob catches the per-arch DMGs that build
            # jobs uploaded under release-assets/<artifact-name>/dmg/.
            release-assets/*.dmg
            release-assets/**/dmg/*.dmg
            update.json
