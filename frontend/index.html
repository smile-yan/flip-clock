<!DOCTYPE html>
<html lang="zh-CN">
    <head>
        <meta charset="UTF-8">
        <title>翻转时钟</title>
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
        <link rel="stylesheet" href="css/styles.css">
        <script src="js/update.js"></script>
    </head>
    <body>
        <div class="container">
            <div class="date-bar">
                <span class="weekday" id="dateDisplay">hello world</span>
                <span class="lunar" id="lunarDisplay"></span>
            </div>
            <div class="clock" id="clock"></div>
            <div class="motto" id="mottoDisplay">君子三思而后行</div>
        </div>

        <!-- 关于弹窗遮罩 -->
        <div class="about-overlay" id="aboutOverlay"></div>

        <!-- 关于弹窗 -->
        <div class="about-modal" id="aboutModal" role="dialog" aria-labelledby="aboutTitle">
            <div class="window-chrome">
                <span class="dot red about-close-btn" id="aboutCloseBtn" role="button" aria-label="关闭" title="关闭"></span>
                <span class="window-title" id="aboutTitle">关于</span>
            </div>
            <div class="about-content">
                <div class="about-icon">
                    <img src="imgs/about-icon.png" alt="翻转时钟" width="80" height="80">
                </div>
                <h1 class="about-title">翻转时钟</h1>
                <p class="about-version" id="aboutVersion">版本 1.0.0</p>
                <p class="about-desc">一个简洁优雅的翻页时钟应用</p>
                <div class="about-links">
                    <a href="https://github.com/smile-yan/flip-clock" id="aboutGithubLink" class="about-link" target="_blank">
                        <svg viewBox="0 0 24 24" width="16" height="16" fill="currentColor">
                            <path d="M12 0c-6.626 0-12 5.373-12 12 0 5.302 3.438 9.8 8.207 11.387.599.111.793-.261.793-.577v-2.234c-3.338.726-4.033-1.416-4.033-1.416-.546-1.387-1.333-1.756-1.333-1.756-1.089-.745.083-.729.083-.729 1.205.084 1.839 1.237 1.839 1.237 1.07 1.834 2.807 1.304 3.492.997.107-.775.418-1.305.762-1.604-2.665-.305-5.467-1.334-5.467-5.931 0-1.311.469-2.381 1.236-3.221-.124-.303-.535-1.524.117-3.176 0 0 1.008-.322 3.301 1.23.957-.266 1.983-.399 3.003-.404 1.02.005 2.047.138 3.006.404 2.291-1.552 3.297-1.23 3.297-1.23.653 1.653.242 2.874.118 3.176.77.84 1.235 1.911 1.235 3.221 0 4.609-2.807 5.624-5.479 5.921.43.372.823 1.102.823 2.222v3.293c0 .319.192.694.801.576 4.765-1.589 8.199-6.086 8.199-11.386 0-6.627-5.373-12-12-12z"/>
                        </svg>
                        GitHub
                    </a>
                    <span class="about-divider">|</span>
                    <span class="about-copyright">© 2024 smile-yan</span>
                </div>
            </div>
        </div>

        <!-- 设置弹窗遮罩 -->
        <div class="settings-overlay" id="settingsOverlay"></div>

        <!-- 设置弹窗 -->
        <div class="settings-modal" id="settingsModal" role="dialog" aria-labelledby="settingsTitle">
            <div class="window-chrome">
                <span class="dot red close-btn" id="closeBtn" role="button" aria-label="关闭" title="关闭"></span>
                <span class="window-title" id="settingsTitle">设置</span>
            </div>

            <!-- 样式 -->
            <section class="settings-section">
                <span class="section-label">样式：</span>
                <div class="style-options" id="styleOptions">
                    <label class="style-option" data-style="without-seconds">
                        <input type="radio" name="style" value="without-seconds">
                        <div class="preview preview-minimal">
                            <div class="preview-am-pm">PM</div>
                            <div class="preview-row">
                                <div class="preview-card"><span>03</span></div>
                                <div class="preview-card"><span>35</span></div>
                            </div>
                        </div>
                    </label>
                    <label class="style-option" data-style="with-seconds">
                        <input type="radio" name="style" value="with-seconds">
                        <div class="preview preview-full">
                            <div class="preview-row">
                                <div class="preview-card"><span>03</span></div>
                                <div class="preview-card"><span>34</span></div>
                                <div class="preview-card"><span>18</span></div>
                            </div>
                        </div>
                    </label>
                </div>
            </section>

            <!-- 时间格式 -->
            <section class="settings-section">
                <span class="section-label">时间格式：</span>
                <div class="select-wrapper">
                    <select id="timeFormatSelect" class="settings-select">
                        <option value="24h">24 小时</option>
                        <option value="12h">12 小时</option>
                    </select>
                </div>
            </section>

            <!-- 主题 -->
            <section class="settings-section">
                <span class="section-label">主题：</span>
                <div class="select-wrapper">
                    <select id="themeSelect" class="settings-select">
                        <option value="dark">深色</option>
                        <option value="light">浅色</option>
                        <option value="sepia">米色</option>
                        <option value="blue">蓝色</option>
                        <option value="forest">森林</option>
                        <option value="sunset">日落</option>
                        <option value="midnight">深夜</option>
                        <option value="ocean">海洋</option>
                        <option value="rose">玫瑰</option>
                        <option value="slate">石板</option>
                    </select>
                </div>
            </section>

            <!-- 显示 -->
            <section class="settings-section">
                <span class="section-label">显示：</span>
                <div class="checkbox-grid">
                    <label class="check-line">
                        <input type="checkbox" id="showDateCheck">
                        <span class="check-box"></span>
                        <span class="check-text">日期</span>
                    </label>
                    <label class="check-line">
                        <input type="checkbox" id="showLunarCheck">
                        <span class="check-box"></span>
                        <span class="check-text">农历</span>
                    </label>
                    <label class="check-line">
                        <input type="checkbox" id="showMottoCheck">
                        <span class="check-box"></span>
                        <span class="check-text">座右铭</span>
                    </label>
                    <label class="check-line">
                        <input type="checkbox" id="showInDockCheck">
                        <span class="check-box"></span>
                        <span class="check-text">桌面图标（Dock/任务栏）</span>
                    </label>
                </div>
            </section>

            <!-- 座右铭输入 -->
            <section class="settings-section motto-input-section">
                <input type="text" id="mottoInput" class="settings-text-input" maxlength="200"
                    placeholder="输入完成后，单击空白空间以确认。">
            </section>
</div>

        <script src="clock.js"></script>
    </body>
</html>
